name: MLBM CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # sjasmplus нет в apt (Ubuntu/Debian) - кэшируем готовую установку по версии,
    # чтобы не собирать из исходников на каждом прогоне.
    - name: Cache sjasmplus
      uses: actions/cache@v4
      with:
        path: |
          /opt/sjasmplus
          ~/.local/sjasmplus
          ~/.cache/sjasmplus-v1.24.0
        key: sjasmplus-v1.24.0-ubuntu-latest-${{ runner.arch }}

    - name: Install dependencies (ffmpeg)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Configure
      run: ./configure

    - name: Init (sjasmplus + tools)
      run: make init

    - name: Build
      run: make build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlbm-trd
        path: src/build/mlbm.trd
